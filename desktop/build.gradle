task inspectDesktopIcons(type: JavaExec) {
    group = 'verification'
    dependsOn classes
    mainClass = 'wk.com.test.DemoLauncher'
    classpath = sourceSets.main.runtimeClasspath
    workingDir rootProject.file('assets')
    args '--inspect-icons'
